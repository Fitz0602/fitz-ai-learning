let currentQ = 0;
let score = { correct: 0, wrong: 0 };
let answered = new Set();

function renderQuiz() {
  const container = document.getElementById('quiz-container');
  const dotsContainer = document.getElementById('dots');
  dotsContainer.innerHTML = quizData.map(function(_, i) {
    return '<div class="dot' + (answered.has(i) ? ' done' : '') + (i === currentQ ? ' current' : '') + '" data-i="' + i + '"></div>';
  }).join('');

  if (currentQ >= quizData.length) {
    showScore();
    return;
  }

  const q = quizData[currentQ];
  const isAnswered = answered.has(currentQ);
  container.innerHTML =
    '<div class="section-divider">' + q.section + ' · 第 ' + q.num + ' 题</div>' +
    '<div class="q-block' + (isAnswered ? ' answered' : '') + '" id="qb' + currentQ + '">' +
      '<div class="q-num">Question ' + q.num + ' / ' + quizData.length + '</div>' +
      '<div class="q-text">' + q.question + '</div>' +
      '<div class="options" id="opts' + currentQ + '">' +
        q.options.map(function(o, i) {
          return '<div class="opt' + (isAnswered ? ' locked' : '') + '" data-i="' + i + '" onclick="selectOpt(' + i + ')">' + o.label + '. ' + o.text + '</div>';
        }).join('') +
      '</div>' +
      '<div class="action-btns" id="btns' + currentQ + '">' +
        '<button class="q-btn submit-btn" onclick="submitAnswer()" ' + (isAnswered ? 'disabled' : '') + '>提交答案</button> ' +
        '<button class="q-btn reveal-btn" onclick="revealAnswer()" ' + (isAnswered ? 'disabled' : '') + '>查看答案</button>' +
      '</div>' +
      '<div class="feedback" id="fb' + currentQ + '"></div>' +
      '<div class="source" id="src' + currentQ + '" style="display:none">' + q.source + '</div>' +
    '</div>';

  if (isAnswered) {
    const selIdx = q._selected;
    if (selIdx !== undefined) {
      document.querySelectorAll('#opts' + currentQ + ' .opt').forEach(function(el, i) {
        el.classList.toggle('selected', i === selIdx);
        el.classList.toggle('correct', q.options[i].correct);
        el.classList.toggle('wrong', i === selIdx && !q.options[i].correct);
      });
      showFeedback(true);
    }
  }

  dotsContainer.querySelectorAll('.dot').forEach(function(d) {
    d.onclick = function() { currentQ = parseInt(d.dataset.i); renderQuiz(); };
  });
}

function selectOpt(idx) {
  if (answered.has(currentQ)) return;
  document.querySelectorAll('#opts' + currentQ + ' .opt').forEach(function(el, i) {
    el.classList.toggle('selected', i === idx);
  });
  quizData[currentQ]._selected = idx;
}

function submitAnswer() {
  if (answered.has(currentQ)) return;
  const q = quizData[currentQ];
  const selIdx = q._selected;
  if (selIdx === undefined) { alert('请先选择一个选项'); return; }
  answered.add(currentQ);

  const isCorrect = q.options[selIdx].correct;
  if (isCorrect) score.correct++; else score.wrong++;

  document.querySelectorAll('#opts' + currentQ + ' .opt').forEach(function(el, i) {
    el.classList.add('locked');
    if (q.options[i].correct) el.classList.add('correct');
    else if (i === selIdx) el.classList.add('wrong');
  });

  showFeedback(true);
  document.getElementById('btns' + currentQ).querySelectorAll('.q-btn').forEach(function(b) { b.disabled = true; });
}

function revealAnswer() {
  if (answered.has(currentQ)) return;
  answered.add(currentQ);
  score.wrong++;

  const q = quizData[currentQ];
  q._revealed = true;

  document.querySelectorAll('#opts' + currentQ + ' .opt').forEach(function(el, i) {
    el.classList.add('locked');
    if (q.options[i].correct) el.classList.add('correct');
  });

  showFeedback(false);
  document.getElementById('btns' + currentQ).querySelectorAll('.q-btn').forEach(function(b) { b.disabled = true; });
}

function showFeedback(isSubmitted) {
  const q = quizData[currentQ];
  const fb = document.getElementById('fb' + currentQ);
  const src = document.getElementById('src' + currentQ);
  const selIdx = q._selected;
  const isCorrect = q.options[selIdx] ? q.options[selIdx].correct : false;

  if (isSubmitted && isCorrect) {
    fb.className = 'feedback show correct-fb';
    fb.innerHTML = '<strong>✅ 正确！</strong> ' + q.explanation;
  } else if (isSubmitted && !isCorrect) {
    fb.className = 'feedback show wrong-fb';
    fb.innerHTML = '<strong>❌ 错误。</strong> 正确答案是 <strong>' + q.options.find(function(o){return o.correct}).label + '</strong>。' + q.explanation;
  } else {
    fb.className = 'feedback show wrong-fb';
    fb.innerHTML = '<strong>📖 参考答案：</strong>' + q.explanation;
  }
  src.style.display = 'block';
}

function showScore() {
  document.getElementById('quiz-container').innerHTML = '';
  document.getElementById('scoreBar').classList.add('show');
  document.getElementById('scoreNum').textContent = score.correct + '/' + quizData.length;
  document.getElementById('correctNum').textContent = score.correct;
  document.getElementById('wrongNum').textContent = score.wrong;
}

// Init
renderQuiz();
</script>

</body>
</html>
