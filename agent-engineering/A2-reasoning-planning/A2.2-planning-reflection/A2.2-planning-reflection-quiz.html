<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Quiz · A2.2 Planning · 任务分解 · 反思循环</title>
<style>
:root {
  --bg: #fafaf7; --card: #ffffff; --text: #1a1a1a; --muted: #6b6b6b;
  --border: rgba(0,0,0,0.08);

  --blue: #185FA5; --blue-bg: #E6F1FB;
  --coral: #993C1D; --coral-bg: #FAECE7;
}
* { box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.7;

}
.header { border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 28px; }
.tag-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
.tag { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.tag.t2 { background: var(--teal-bg); color: #0F6E56; }
.nav-link { font-size: 12px; color: var(--purple); text-decoration: none; border: 1px solid var(--purple); padding: 3px 10px; border-radius: 12px; font-weight: 500; white-space: nowrap; }
.nav-link:hover { background: var(--purple); color: white; }
h1 { font-size: 20px; font-weight: 600; margin: 8px 0 2px; }
.subtitle { color: var(--muted); font-size: 13px; }
.section-divider { font-size: 11px; color: var(--teal); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin: 28px 0 8px; padding: 4px 10px; background: var(--teal-bg); border-radius: 6px; display: inline-block; }
.q-block { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; margin: 12px 0; transition: opacity 0.2s; }
.q-block.answered { opacity: 0.85; }
.q-num { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.q-text { font-size: 15px; font-weight: 500; margin-bottom: 16px; line-height: 1.5; }
.options { display: flex; flex-direction: column; gap: 8px; }
.opt { padding: 10px 14px 10px 42px; border-radius: 8px; border: 1.5px solid var(--border); cursor: pointer; font-size: 14px; transition: all 0.15s; background: var(--card); line-height: 1.5; position: relative; }
.opt:hover { border-color: var(--purple); background: var(--purple-bg); }
.opt.selected { border-color: var(--purple); background: var(--purple-bg); }
.opt.correct { border-color: var(--teal); background: var(--teal-bg); }
.opt.wrong { border-color: var(--coral); background: var(--coral-bg); }
.opt::before { content: ''; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; border: 2px solid var(--border); border-radius: 50%; transition: all 0.15s; background: white; }
.opt.selected::before { border-color: var(--purple); background: var(--purple); }
.opt.selected::after { content: ''; position: absolute; left: 14px; top: 50%; transform: translateY(-50%) rotate(45deg); width: 5px; height: 9px; border: solid white; border-width: 0 2px 2px 0; }
.opt.locked { pointer-events: none; }
.action-btns { display: flex; gap: 8px; margin-top: 14px; }
.q-btn { flex: 1; padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1.5px solid var(--border); background: var(--card); color: var(--text); transition: all 0.15s; text-align: center; }
.q-btn:hover { border-color: var(--purple); background: var(--purple-bg); }
.q-btn.submit-btn { background: var(--purple); color: white; border-color: var(--purple); }
.q-btn.submit-btn:hover { background: #3C3489; }
.q-btn.reveal-btn { color: var(--muted); }
.q-btn.reveal-btn:hover { color: var(--text); }
.q-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.feedback { margin-top: 14px; padding: 12px 16px; border-radius: 8px; font-size: 14px; display: none; line-height: 1.6; }
.feedback.show { display: block; }
.feedback.correct-fb { background: var(--teal-bg); color: #085041; }
.feedback.wrong-fb { background: var(--coral-bg); color: #711B0C; }
.source { font-size: 11px; color: var(--muted); margin-top: 8px; }
.score-bar { background: var(--purple-bg); border-radius: 12px; padding: 24px; margin-top: 32px; text-align: center; display: none; }
.score-bar.show { display: block; }
.score-num { font-size: 44px; font-weight: 700; color: var(--purple); }
.score-label { font-size: 13px; color: var(--muted); margin-top: 4px; }
.score-detail { display: flex; justify-content: center; gap: 24px; margin-top: 16px; font-size: 13px; }
.score-item { text-align: center; }
.score-item .num { font-size: 22px; font-weight: 600; color: var(--text); }
.score-item .lbl { font-size: 11px; color: var(--muted); }
.progress-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 24px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #e0e0dc; transition: all 0.3s; }
.dot.done { background: var(--teal); }
.dot.current { background: var(--purple); box-shadow: 0 0 0 3px var(--purple-bg); }
</style>

  // ===== §③ 为什么（Q5-Q6）=====
  {
    section: "§③ 为什么",
    num: 5,
    question: "章节用一个数字例子说明搜索空间裁剪的威力：DDAgent 尽调 5 步流程，每步平均 8 种可选组合。纯 ReAct 盲搜 vs Plan-Act-Reflect 的探索量分别约为多少？缩小了多少倍？",

      { label: "B", text: "浪费约 $0.5-$2.0（4次Tool调用+4次LLM推理+上下文重建），ROI 通常在 10x-50x", correct: true },
      { label: "C", text: "浪费约 $10-$20，ROI 约 100x+", correct: false },
      { label: "D", text: "不产生额外成本，因为 LLM 会自动纠正", correct: false }
    ],
    explanation: "错误传播的成本 = N步浪费的Tool调用(N×$0.02~$0.10) + N步浪费的LLM推理(N×$0.01~$0.05) + 上下文重建($0.10~$0.30)。对5步任务约$0.5-$2。除以单次Reflect成本$0.01-$0.03 → ROI 10x-50x。",
    source: "A2.2 §3.2 反思的经济学"
  },

  // ===== §④ 演进（Q7-Q8）=====
  {
    section: "§④ 演进",
    num: 7,
    question: "SPIRAL（IBM, AAAI 2026）与传统 Plan-Act-Reflect 框架的最根本区别是什么？",
    options: [
      { label: "A", text: "SPIRAL 只能用于游戏和模拟环境，不能用于实际业务", correct: false },
      { label: "B", text: "SPIRAL 将 P-A-R 从单一 LLM 承担拆分为 Planner/Simulator/Critic 三个专门化角色，避免认知偏差", correct: true },
      { label: "C", text: "SPIRAL 不需要 LLM，完全基于规则引擎", correct: false },
      {label: "D", text: "SPIRAL 只支持并行执行，不支持串行步骤", correct: false }
    ],
    explanation: "传统框架中 Plan/Act/Reflect 都由同一个 LLM 承担（既是运动员又是裁判）。SPIRAL 引入角色分工：Planner=创意发散(像PM)、Simulator=务实检验(像QA)、Critic=严苛评审(像Tech Lead)。DailyLifeAPIs 准确率83.6%，超次优基线16pp+。",
    source: "A2.2 §4.2 SPIRAL 架构解读"
  },
  {
    section: "§④ 演进",
    num: 8,
    question: "Anthropic 总结的企业级五种工作流中，哪种最接近 Plan-Act-Reflect 的工程实践？它的对应关系是怎样的？",
    options: [
      { label: "A", text: "#1 链式提示 — 对应 Act 阶段的串行流水线", correct: false },
      { label: "B", text: "#2 路由系统 — 对应 Plan 阶段的意图分类", correct: false },
      { label: "C", text: "#4 协调器编排（Orchestrator-Workers）— Coordinator 承担 Plan+Reflect，Workers 承担 Act", correct: true },
      { label: "D", text: "#5 评估器优化器 — 完全等同于 Reflect 阶段", correct: false }
    ],

  // ===== §⑤ 连接（Q9-Q10）=====
  {
    section: "§⑤ 连接",

    options: [
      { label: "A", text: "Dispatcher=Act, 子Agent=Plan, 结果汇聚=Reflect", correct: false },
      { label: "B", text: "Dispatcher=Plan（意图理解+路由决策），子Agent集群=Act（各司其职执行Tool调用），结果汇聚+准确率判断=Reflect", correct: true },

      { label: "B", text: "83%=Plan的高质量路由确保自动化覆盖广, 95%=Reflect拦截低质量结果, 100%=Plan从不发错目标", correct: true },

let currentQ = 0;
let score = { correct: 0, wrong: 0 };
let answered = new Set();

function renderQuiz() {
  const container = document.getElementById('quiz-container');
  const dotsContainer = document.getElementById('dots');
  dotsContainer.innerHTML = quizData.map(function(_, i) {
    return '<div class="dot ' + (answered.has(i) ? 'done' : '') + ' ' + (i === currentQ ? 'current' : '') + '" data-i="' + i + '"></div>';
  }).join('');

  if (currentQ >= quizData.length) {
    showScore();
    return;
  }

  var q = quizData[currentQ];
  var isAnswered = answered.has(currentQ);
  container.innerHTML =
    '<div class="section-divider">' + q.section + ' · 第 ' + q.num + ' 题</div>' +
    '<div class="q-block ' + (isAnswered ? 'answered' : '') + '" id="qb' + currentQ + '">' +
      '<div class="q-num">Question ' + q.num + ' / ' + quizData.length + '</div>' +
      '<div class="q-text">' + q.question + '</div>' +
      '<div class="options" id="opts' + currentQ + '">' +
        q.options.map(function(o, i) {
          return '<div class="opt' + (isAnswered ? ' locked' : '') + '" data-i="' + i + '" onclick="selectOpt(' + i + ')">' + o.label + '. ' + o.text + '</div>';
        }).join('') +
      '</div>' +
      '<div class="action-btns" id="btns' + currentQ + '">' +
        '<button class="q-btn submit-btn" onclick="submitAnswer()" ' + (isAnswered ? 'disabled' : '') + '>提交答案</button> ' +
        '<button class="q-btn reveal-btn" onclick="revealAnswer()" ' + (isAnswered ? 'disabled' : '') + '>查看答案</button>' +
      '</div>' +
      '<div class="feedback" id="fb' + currentQ + '"></div>' +
      '<div class="source" id="src' + currentQ + '" style="display:none">' + q.source + '</div>' +
    '</div>';

  if (isAnswered) {
    var selIdx = q._selected;
    if (selIdx !== undefined) {
      document.querySelectorAll('#opts' + currentQ + ' .opt').forEach(function(el, i) {
        el.classList.toggle('selected', i === selIdx);
        el.classList.toggle('correct', q.options[i].correct);
        el.classList.toggle('wrong', i === selIdx && !q.options[i].correct);
      });
      showFeedback(true);
    }
  }

  dotsContainer.querySelectorAll('.dot').forEach(function(d) {
    d.onclick = function() { currentQ = parseInt(d.dataset.i); renderQuiz(); };
  });
}

function selectOpt(idx) {
  if (answered.has(currentQ)) return;
  document.querySelectorAll('#opts' + currentQ + ' .opt').forEach(function(el, i) {
    el.classList.toggle('selected', i === idx);
  });
  quizData[currentQ]._selected = idx;
}

function submitAnswer() {
  if (answered.has(currentQ)) return;
  var q = quizData[currentQ];
  var selIdx = q._selected;
  if (selIdx === undefined) { alert('请先选择一个选项'); return; }
  answered.add(currentQ);

  var isCorrect = q.options[selIdx].correct;
  if (isCorrect) score.correct++; else score.wrong++;

  document.querySelectorAll('#opts' + currentQ + ' .opt').forEach(function(el, i) {
    el.classList.add('locked');
    if (q.options[i].correct) el.classList.add('correct');
    else if (i === selIdx) el.classList.add('wrong');
  });

  showFeedback(isCorrect);
  document.getElementById('btns' + currentQ).querySelectorAll('.q-btn').forEach(function(b) { b.disabled = true; });
}

function revealAnswer() {
  if (answered.has(currentQ)) return;
  answered.add(currentQ);
  score.wrong++;

  var q = quizData[currentQ];
  q._revealed = true;

  document.querySelectorAll('#opts' + currentQ + ' .opt').forEach(function(el, i) {
    el.classList.add('locked');
    if (q.options[i].correct) el.classList.add('correct');
  });

  showFeedback(false);
  document.getElementById('btns' + currentQ).querySelectorAll('.q-btn').forEach(function(b) { b.disabled = true; });
}

function showFeedback(isSubmitted) {
  var q = quizData[currentQ];
  var fb = document.getElementById('fb' + currentQ);
  var src = document.getElementById('src' + currentQ);
  var selIdx = q._selected;
  var isCorrect = q.options[selIdx] ? q.options[selIdx].correct : false;

  if (isSubmitted && isCorrect) {
    fb.className = 'feedback show correct-fb';
    fb.innerHTML = '<strong>✅ 正确！</strong> ' + q.explanation;
  } else if (isSubmitted && !isCorrect) {
    fb.className = 'feedback show wrong-fb';
    fb.innerHTML = '<strong>❌ 错误。</strong> 正确答案是 <strong>' + q.options.find(function(o){return o.correct}).label + '</strong>。' + q.explanation;
  } else {
    fb.className = 'feedback show wrong-fb';
    fb.innerHTML = '<strong>📖 参考答案：</strong>' + q.explanation;
  }
  src.style.display = 'block';
}

function showScore() {
  document.getElementById('quiz-container').innerHTML = '';
  document.getElementById('scoreBar').classList.add('show');
  document.getElementById('scoreNum').textContent = score.correct + '/' + quizData.length;
  document.getElementById('correctNum').textContent = score.correct;
  document.getElementById('wrongNum').textContent = score.wrong;
}

// Init
renderQuiz();
</script>

</body>
</html>
